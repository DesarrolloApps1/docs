<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><title>06 · Configuración · Dos permisos</title><style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap');</style><rect width="360" height="800" fill="#F7F3EC"/><g id="Status bar"><text x="24" y="17" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#16211C" text-anchor="start">9:41</text><rect x="290" y="10" width="2.5" height="4" rx="1" fill="#16211C"/><rect x="294" y="8" width="2.5" height="6" rx="1" fill="#16211C"/><rect x="298" y="6" width="2.5" height="8" rx="1" fill="#16211C"/><rect x="302" y="4" width="2.5" height="10" rx="1" fill="#16211C"/><g transform="translate(306 3) scale(0.5833)" fill="none" stroke="#16211C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.8 16a5 5 0 0 1 6.4 0"/><circle cx="12" cy="19.2" r=".6" fill="#16211C"/></g><rect x="324" y="6" width="20" height="10" rx="3" fill="none" stroke="#16211C" stroke-width="1.4"/><rect x="326" y="8" width="13" height="6" rx="1.5" fill="#16211C"/></g><text x="20" y="100" font-family="Bricolage Grotesque, sans-serif" font-size="32" font-weight="800" text-anchor="start"><tspan x="20" dy="0" fill="#16211C">Dos permisos</tspan><tspan x="20" dy="36" fill="#136B4A">y listo.</tspan></text><text x="20" y="168" font-family="DM Sans, sans-serif" font-size="15" font-weight="400" fill="#5F6B64" text-anchor="start"><tspan x="20" dy="0">Los pedimos una sola vez y podés</tspan><tspan x="20" dy="21">cambiarlos cuando quieras.</tspan></text><g id="Paso 1 · Acceso a uso (listo)"><rect x="20" y="216" width="320" height="132" rx="24" fill="#FFFFFF" stroke="#136B4A" stroke-width="1.5"/><rect x="36" y="232" width="48" height="48" rx="16" fill="#DDF2E6"/><g transform="translate(48.0 244.0) scale(1.0000)" fill="none" stroke="#136B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="96" y="252" font-family="DM Sans, sans-serif" font-size="16" font-weight="800" fill="#16211C" text-anchor="start">Acceso a uso</text><text x="96" y="272" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#5F6B64" text-anchor="start">Obligatorio</text><g id="Chip"><rect x="266.4" y="240" width="57.6" height="26" rx="13.0" fill="#DDF2E6"/><text x="278.4" y="257.2" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#136B4A" text-anchor="start">Listo</text></g><text x="36" y="306" font-family="DM Sans, sans-serif" font-size="13" font-weight="400" fill="#5F6B64" text-anchor="start"><tspan x="36" dy="0">Solo vemos cuándo la pantalla se prende</tspan><tspan x="36" dy="19">y se apaga. Nunca qué apps usás.</tspan></text></g><g id="Paso 2 · Notificaciones (pendiente)"><rect x="20" y="364" width="320" height="188" rx="24" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="1"/><rect x="36" y="380" width="48" height="48" rx="16" fill="#FFF3D6"/><g transform="translate(48.0 392.0) scale(1.0000)" fill="none" stroke="#C98A12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 21h4"/></g><text x="96" y="400" font-family="DM Sans, sans-serif" font-size="16" font-weight="800" fill="#16211C" text-anchor="start">Notificaciones</text><text x="96" y="420" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#5F6B64" text-anchor="start">Recomendado</text><text x="36" y="454" font-family="DM Sans, sans-serif" font-size="13" font-weight="400" fill="#5F6B64" text-anchor="start"><tspan x="36" dy="0">Te avisamos cuando sumás puntos</tspan><tspan x="36" dy="19">o cuando tu canje se confirma.</tspan></text><g id="Button/outline"><rect x="36" y="488" width="136" height="48" rx="24.0" fill="none" stroke="#0B3B2C" stroke-width="1.5"/><text x="104.0" y="517.25" font-family="DM Sans, sans-serif" font-size="15" font-weight="700" fill="#0B3B2C" text-anchor="middle">Permitir</text></g></g><g transform="translate(20 578) scale(0.8333)" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></g><text x="50" y="593" font-family="DM Sans, sans-serif" font-size="13" font-weight="400" fill="#5F6B64" text-anchor="start"><tspan x="50" dy="0">La ubicación la pedimos recién cuando</tspan><tspan x="50" dy="19">abras el mapa, y es opcional.</tspan></text><g id="Button/primary"><rect x="20" y="700" width="320" height="56" rx="28.0" fill="#0B3B2C"/><text x="180.0" y="733.6" font-family="DM Sans, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Continuar</text></g><rect x="140" y="788" width="80" height="4" rx="2" fill="#16211C" opacity="0.35"/></svg>